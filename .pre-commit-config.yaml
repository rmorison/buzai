# Local quality + leak gate. Install once per clone: `make dev` (wraps `pre-commit install`).
# CI runs the identical set (`pre-commit run --all-files`) as the backstop — the hooks on
# your machine are the primary gate, firing BEFORE anything is world-readable.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # The leak gate (see docs/dev/PUBLIC-SEED.md): generic patterns always; the
  # private pattern file on the maintainer's machine extends coverage to literal
  # PII/infra names. Stdlib-only, so plain python3 works everywhere.
  - repo: local
    hooks:
      - id: publish-gate
        name: publish gate (PII/infra leak check)
        entry: python3 scripts/publish_gate.py
        language: system
        types: [text]
