name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: read-only token, no secrets exposed to fork PRs.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Create pinned venv
        run: make venv

      - name: Install pre-commit
        run: pipx install pre-commit

      # The leak-gate hook refuses to run without gitleaks. The version and its
      # SHA-256 are pinned in scripts/install-gitleaks.sh and nowhere else.
      - name: Install gitleaks
        run: |
          sh scripts/install-gitleaks.sh "$RUNNER_TEMP/gitleaks-bin"
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Hooks (hygiene, ruff, leak gate)
        run: pre-commit run --all-files --show-diff-on-failure

      # buzai's own shape rules, appended to .gitleaks.toml. They run here rather
      # than in leaks.yml, which stays a verbatim copy of engineering-standards'
      # workflow (docs/dev/PUBLIC-SEED.md records the difference).
      - name: Prove buzai's shape rules fire
        run: sh scripts/test-shape-rules.sh

      - name: Tests
        run: make test
